name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tulis proyek
        run: |
          mkdir -p yt-float && cd yt-float
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include(":app")
          EOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          kotlin.daemon.jvmargs=-Xmx2g
          EOF
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.ytfloat"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.ytfloat"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              flavorDimensions += "clone"
              productFlavors {
                  // 10 salinan: id berbeda = data aplikasi (login, cookie) terpisah
                  for (i in 1..10) {
                      create("y$i") {
                          dimension = "clone"
                          applicationId = "com.example.ytfloat.y$i"
                          manifestPlaceholders["appLabel"] = "YT$i"
                      }
                  }
              }
              buildTypes { release {
                  isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  signingConfig = signingConfigs.getByName("debug")
              } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="${appLabel}" android:icon="@android:drawable/ic_media_play"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatService" android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF
          mkdir -p "$(dirname app/src/main/java/com/example/ytfloat/MainActivity.kt)"
          cat > app/src/main/java/com/example/ytfloat/MainActivity.kt <<'EOF'
          package com.example.ytfloat

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.webkit.*
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.Toast

          const val START = "https://m.youtube.com"
          private val OK = Regex("(^|\\.)(youtube\\.com|youtu\\.be|google\\.[a-z.]+|gstatic\\.com|googleusercontent\\.com|ytimg\\.com|googlevideo\\.com)$")

          // Pengawas: jika video terjeda bukan karena sentuhan pengguna (<2 dtk), putar lagi tiap 0,7 dtk.
          // "Mode campur" selalu aktif -> video dibisukan (tidak minta audio focus),
          // suaranya dialirkan lewat Web Audio. Setiap jeda tak terduga ditampilkan sebagai Toast (diagnosa).
          private const val JS = """(function(){
          if(window.__k)return;window.__k=1;
          var t=0,on=true,want=false,ctx=null,src=null,cs=null,csv=null,last='',lg=0;
          function log(m){var n=Date.now();if(n-lg<3000)return;lg=n;try{if(window.A)A.log(m)}catch(x){}}
          function rv(){try{return Object.getOwnPropertyDescriptor(Document.prototype,'visibilityState').get.call(document)}catch(x){return '?'}}
          function vid(){return document.querySelector('video')}
          ['touchstart','mousedown','keydown'].forEach(function(e){document.addEventListener(e,function(){t=Date.now()},true)});
          document.addEventListener('playing',function(e){if(e.target.tagName==='VIDEO'){want=true;if(on)setTimeout(apply,300)}},true);
          document.addEventListener('ended',function(e){want=false},true);
          document.addEventListener('pause',function(e){var v=e.target;if(v.tagName!=='VIDEO')return;
          if(v.ended||Date.now()-t<2000){want=false;return}
          log('dijeda: '+rv()+' fokus='+document.hasFocus()+' mute='+v.muted+' campur='+on)},true);
          setInterval(function(){var v=vid();if(want&&v&&v.paused&&!v.ended&&Date.now()-t>2000){var p=v.play();if(p&&p.catch)p.catch(function(){})}},700);
          try{Object.defineProperty(document,'hidden',{get:function(){return false}});
          Object.defineProperty(document,'visibilityState',{get:function(){return 'visible'}})}catch(x){}
          document.addEventListener('visibilitychange',function(e){e.stopImmediatePropagation()},true);
          function apply(){var v=vid();if(!on||!v)return 'tidak ada video';
          if(!v.captureStream)return 'captureStream tidak didukung';
          if(v!==csv||!src){cs=v.captureStream();csv=v}
          var a=cs.getAudioTracks();if(!a.length)return 'audio belum siap, putar video dulu';
          if(!src||last!==a[0].id){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
          try{if(src)src.disconnect()}catch(x){}
          src=ctx.createMediaStreamSource(new MediaStream(a));last=a[0].id;src.connect(ctx.destination)}
          ctx.resume();v.muted=true;return 'campur AKTIF'}
          document.addEventListener('volumechange',function(e){if(on&&e.target.tagName==='VIDEO'&&!e.target.muted)e.target.muted=true},true);
          })();"""

          class Bridge(private val c: Context) {
              @JavascriptInterface fun log(m: String) {
                  Handler(Looper.getMainLooper()).post { Toast.makeText(c, m, Toast.LENGTH_SHORT).show() }
              }
          }

          // WebView bersama (Activity & overlay). Cookie login dibagi otomatis lewat CookieManager.
          @SuppressLint("SetJavaScriptEnabled")
          fun newWeb(c: Context): WebView {
              val w = WebView(c)
              w.settings.apply {
                  javaScriptEnabled = true
                  domStorageEnabled = true
                  mediaPlaybackRequiresUserGesture = false
                  // Hilangkan penanda WebView agar login Google lebih mungkin diterima
                  userAgentString = userAgentString.replace("; wv", "").replace("Version/4.0 ", "")
              }
              CookieManager.getInstance().setAcceptCookie(true)
              CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)
              w.addJavascriptInterface(Bridge(c), "A")
              w.webViewClient = object : WebViewClient() {
                  // Hanya domain YouTube/Google yang boleh dibuka
                  override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest) =
                      !OK.containsMatchIn(r.url.host ?: "")
                  override fun onPageStarted(v: WebView, u: String?, f: Bitmap?) { v.evaluateJavascript(JS, null) }
                  override fun onPageFinished(v: WebView, u: String?) { v.evaluateJavascript(JS, null) }
              }
              w.webChromeClient = WebChromeClient()
              return w
          }

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  web = newWeb(this)
                  val btn = Button(this).apply { text = "▶ Float"; setOnClickListener { float() } }
                  setContentView(FrameLayout(this).apply {
                      addView(web, FrameLayout.LayoutParams(-1, -1))
                      addView(btn, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.END).apply {
                          val dp = resources.displayMetrics.density // naikkan tombol agar tidak menutup tab "Anda"/profil
                          setMargins(0, 0, (16 * dp).toInt(), (96 * dp).toInt())
                      })
                  })
                  web.loadUrl(intent?.data?.toString() ?: START)
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 0)
              }

              private fun float() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  CookieManager.getInstance().flush()
                  startForegroundService(Intent(this, FloatService::class.java).putExtra("u", web.url ?: START))
                  web.loadUrl("about:blank") // hentikan putar di sini agar tidak dobel suara
                  moveTaskToBack(true)
              }

              override fun onResume() { super.onResume(); if (web.url == "about:blank") web.loadUrl(START) }
              override fun onPause() { CookieManager.getInstance().flush(); super.onPause() }
              override fun onDestroy() { web.destroy(); super.onDestroy() }
              @Deprecated("") override fun onBackPressed() { if (web.canGoBack()) web.goBack() else super.onBackPressed() }
          }
          EOF
          mkdir -p "$(dirname app/src/main/java/com/example/ytfloat/FloatService.kt)"
          cat > app/src/main/java/com/example/ytfloat/FloatService.kt <<'EOF'
          package com.example.ytfloat

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.IBinder
          import android.view.*
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.widget.*

          class FloatService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var bar: View
              private lateinit var bubble: View
              private val idx by lazy { packageName.substringAfterLast(".y").toIntOrNull() ?: 0 } // nomor salinan (YT1..YT10)
              private var root: FrameLayout? = null
              private var web: WebView? = null
              private var pw = 0; private var ph = 0; private var bh = 0; private var bs = 0

              companion object {
                  // HARDWARE_ACCELERATED wajib agar WebView tampil di jendela overlay
                  private const val BASE = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  private const val BUBBLE = BASE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (root != null) return START_NOT_STICKY
                  notif()
                  build(i?.getStringExtra("u") ?: START)
                  return START_NOT_STICKY
              }

              private fun notif() {
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("f", "YouTube", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0, Intent(this, FloatService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "f").setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(if (idx > 0) "YT$idx melayang aktif" else "YouTube melayang aktif").addAction(android.R.drawable.ic_delete, "Stop", stop).build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
              }

              private fun build(url: String) {
                  val d = resources.displayMetrics; val dp = d.density
                  pw = (d.widthPixels * 0.92f).toInt(); ph = (d.heightPixels * 0.5f).toInt()
                  bh = (32 * dp).toInt(); bs = (56 * dp).toInt()
                  wm = getSystemService(WindowManager::class.java)
                  lp = WindowManager.LayoutParams(bs, bs, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, BUBBLE, PixelFormat.TRANSLUCENT)
                      .apply {
                          gravity = Gravity.TOP or Gravity.START // tiap salinan punya posisi awal sendiri agar bubble tidak menumpuk
                          y = if (idx > 0) minOf(d.heightPixels / 12 + (idx - 1) * (bs * 1.15f).toInt(), d.heightPixels - bs) else d.heightPixels / 4
                      }

                  val r = object : FrameLayout(this) {
                      override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                          if (e.keyCode == KeyEvent.KEYCODE_BACK) {
                              if (e.action == KeyEvent.ACTION_UP) { val w = web; if (w != null && w.canGoBack()) w.goBack() else setOpen(false) }
                              return true
                          }
                          return super.dispatchKeyEvent(e)
                      }
                  }
                  // WebView tetap berukuran penuh & terpasang walau jendela mengecil jadi bubble -> suara terus jalan
                  val w = newWeb(this).also { web = it; it.loadUrl(url) }
                  r.addView(w, FrameLayout.LayoutParams(pw, ph).apply { topMargin = bh })

                  fun btn(t: String, a: () -> Unit) = TextView(this).apply {
                      text = t; textSize = 18f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding((14 * dp).toInt(), 0, (14 * dp).toInt(), 0); setOnClickListener { a() }
                  }
                  val handle = TextView(this).apply { text = if (idx > 0) "  ⠿ YT$idx" else "  ⠿ YouTube"; setTextColor(Color.WHITE); gravity = Gravity.CENTER_VERTICAL }
                  bar = LinearLayout(this).apply {
                      setBackgroundColor(0xFF202020.toInt()); visibility = View.GONE
                      addView(handle, LinearLayout.LayoutParams(0, -1, 1f))
                      addView(btn("—") { setOpen(false) }, LinearLayout.LayoutParams(-2, -1))
                      addView(btn("✕") { stopSelf() }, LinearLayout.LayoutParams(-2, -1))
                  }
                  r.addView(bar, FrameLayout.LayoutParams(-1, bh))
                  bubble = TextView(this).apply {
                      text = if (idx > 0) "$idx" else "▶"; textSize = 22f; gravity = Gravity.CENTER; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(0xFFE62117.toInt()); cornerRadius = 18 * dp }
                  }
                  r.addView(bubble, FrameLayout.LayoutParams(bs, bs))
                  root = r
                  drag(bubble) { setOpen(true) }
                  drag(handle, null)
                  wm.addView(r, lp)
              }

              private fun setOpen(o: Boolean) {
                  bar.visibility = if (o) View.VISIBLE else View.GONE
                  bubble.visibility = if (o) View.GONE else View.VISIBLE
                  lp.width = if (o) pw else bs
                  lp.height = if (o) ph + bh else bs
                  lp.flags = if (o) BASE else BUBBLE // saat terbuka perlu fokus agar keyboard bisa muncul
                  if (o) { val d = resources.displayMetrics
                      lp.x = lp.x.coerceIn(0, d.widthPixels - pw); lp.y = lp.y.coerceIn(0, d.heightPixels - ph - bh) }
                  wm.updateViewLayout(root, lp)
              }

              private fun drag(v: View, onTap: (() -> Unit)?) {
                  var sx = 0f; var sy = 0f; var ox = 0; var oy = 0; var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx; val dy = e.rawY - sy
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true
                              if (moved) { lp.x = ox + dx.toInt(); lp.y = oy + dy.toInt(); wm.updateViewLayout(root, lp) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) onTap?.invoke()
                      }
                      true
                  }
              }

              override fun onDestroy() {
                  CookieManager.getInstance().flush()
                  root?.let { wm.removeView(it); it.removeAllViews() }
                  web?.destroy(); web = null; root = null
                  super.onDestroy()
              }
          }
          EOF
      - name: Build
        working-directory: yt-float
        run: gradle assembleDebug --no-daemon
      - name: Kumpulkan APK
        run: |
          mkdir out
          for i in $(seq 1 10); do cp yt-float/app/build/outputs/apk/y$i/debug/app-y$i-debug.apk out/YT$i.apk; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: yt-float-apk
          path: out/*.apk
